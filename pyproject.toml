[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsift"
version = "0.1.0"
description = "Context-aware secret scanner with a reproducible benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["scikit-learn>=1.3", "pandas>=2.0", "numpy>=1.24", "joblib>=1.3", "fastapi>=0.110", "pydantic>=2.5"]

[project.scripts]
secretsift = "secretsift.cli:main"

[tool.setuptools]
packages = ["secretsift"]
